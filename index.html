<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafenance — Legal</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6fb;
    color: #101828;
    line-height: 1.65;
    padding: 24px;
  }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 18px; padding: 40px; max-width: 480px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand img { width: 48px; height: 48px; border-radius: 12px; }
  .brand span { font-weight: 700; letter-spacing: -0.02em; font-size: 1.1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: #475467; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; padding: 14px 16px; border: 1px solid #e4e7ec; border-radius: 12px; color: #1d4ed8; text-decoration: none; font-weight: 600; }
  a:hover { background: #f9fafb; }
  footer { margin-top: 24px; font-size: 0.8125rem; color: #667085; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="icon.png" alt="Cafenance icon">
      <span>Cafenance</span>
    </div>
    <h1>Legal</h1>
    <p>Cafenance is a sales, expense, cash and reporting app for coffee shops.</p>
    <ul>
      <li><a href="privacy.html">Privacy policy</a></li>
      <li><a href="terms.html">Terms of service</a></li>
    </ul>
    <footer>Operated by GalaDevs Tech Corp.</footer>
  </main>
</body>
</html>
